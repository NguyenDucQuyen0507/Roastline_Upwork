# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository. Deploys the API in api/.
services:
  - type: web
    name: roastline-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true # random secret for signing access tokens
      - key: DATABASE_URL
        sync: false # PostgreSQL connection string (e.g. Neon free tier). Unset = in-memory demo data.
      - key: CORS_ORIGIN
        sync: false # e.g. https://roastline-dashboard.netlify.app
